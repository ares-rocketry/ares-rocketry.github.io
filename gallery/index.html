        const TITLE_OVERRIDES = {

            'lemaire_launch_team': 'Lemaire Launch Team',
            'lemwhitesands': 'Lemaire at White Sands',
            'marcus_irec': 'Marcus at IREC'

        const ACRONYMS = new Set(['IREC', 'SAC', 'DAQ', 'CAD', 'ARES', 'CO2', 'GSE', 'SAC22']);

        function titleFromPath(path) {
            const filename = path.split('/').pop().replace(/\.[^.]+$/, '');
            if (TITLE_OVERRIDES[filename]) {
                return TITLE_OVERRIDES[filename];
            }

            let title = filename
                .replace(/_/g, ' ')
                .replace(/-/g, ' ')
                .replace(/([a-z])([A-Z])/g, '$1 $2')
                .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
                .replace(/(\d+)/g, ' $1 ')
                .replace(/\s+/g, ' ')
                .trim();

            return title.split(' ').map(word => {
                const upper = word.toUpperCase();
                if (ACRONYMS.has(upper)) return upper;
                if (/^\d+$/.test(word)) return word;
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(' ');
        }

        let currentIndex = 0;

        function resolveImagePath(path) {
            return path.startsWith('../') || path.startsWith('http') ? path : '../' + path;
        }

        function updateSlide(index) {
            currentIndex = index;
            const path = GALLERY_IMAGES[index];
            const title = titleFromPath(path);
            const img = document.getElementById('gallery-carousel-img');

            img.src = resolveImagePath(path);
            img.alt = title;
            document.getElementById('gallery-carousel-caption').textContent = title;
            document.getElementById('gallery-current').textContent = index + 1;
            document.getElementById('gallery-total').textContent = GALLERY_IMAGES.length;
        }

        function goToSlide(index) {
            const total = GALLERY_IMAGES.length;
            const nextIndex = ((index % total) + total) % total;
            updateSlide(nextIndex);
        }

        function initGalleryCarousel() {
            document.getElementById('gallery-total').textContent = GALLERY_IMAGES.length;

            document.querySelector('.gallery-carousel__nav--prev')
                .addEventListener('click', () => goToSlide(currentIndex - 1));
            document.querySelector('.gallery-carousel__nav--next')
                .addEventListener('click', () => goToSlide(currentIndex + 1));

            document.getElementById('gallery-carousel-img')
                .addEventListener('click', () => openLightbox(GALLERY_IMAGES[currentIndex]));

            updateSlide(0);
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = resolveImagePath(src);
            img.alt = titleFromPath(src);
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('lightbox-img').src = '';
        }

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            const lightboxOpen = document.getElementById('lightbox').classList.contains('active');

            if (e.key === 'Escape') {
                closeLightbox();
                return;
            }

            if (lightboxOpen) return;

            if (e.key === 'ArrowLeft') goToSlide(currentIndex - 1);
            if (e.key === 'ArrowRight') goToSlide(currentIndex + 1);
        });

        initGalleryCarousel();
    </script>
